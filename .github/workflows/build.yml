name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Generate app icon
        run: |
          go run gen_icon.go
          New-Item -ItemType Directory -Path "build\windows" -Force | Out-Null
          Copy-Item "appicon.ico" "build\windows\icon.ico" -Force
        shell: pwsh

      - name: Wails build
        run: wails build -ldflags="-s -w -X main.version=${{ github.ref_name }}"
        shell: pwsh

      - name: Prepare release asset
        run: |
          $files = Get-ChildItem "build\bin" -File
          if ($files.Count -eq 1) {
            Copy-Item $files[0].FullName ".\" -Force
            echo "asset=$($files[0].Name)" >> $env:GITHUB_ENV
          } else {
            Compress-Archive -Path build\bin\* -DestinationPath release.zip -Force
            echo "asset=release.zip" >> $env:GITHUB_ENV
          }
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ env.asset }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
