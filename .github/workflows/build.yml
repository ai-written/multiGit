name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Generate app icon
        run: |
          go run gen_icon.go
          New-Item -ItemType Directory -Path "build\windows" -Force | Out-Null
          Copy-Item "appicon.ico" "build\windows\icon.ico" -Force
        shell: pwsh

      - name: Wails build
        run: wails build -ldflags="-s -w -X main.version=${{ github.ref_name }}"
        shell: pwsh

      - name: Prepare release asset
        run: |
          Compress-Archive -Path build\bin\* -DestinationPath depdash.zip -Force
          $hash = (Get-FileHash depdash.zip -Algorithm SHA256).Hash
          "$hash  depdash.zip" | Out-File -Encoding ascii "depdash.zip.sha256"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            depdash.zip
            depdash.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
