<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MultiGit</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script src="/wailsjs/runtime/runtime.js" type="module"></script>
    <script src="/src/app.js" type="module"></script>
</head>
<body>
    <div id="app">
        <div class="update-bar" id="updateBar" style="display:none">
            <span class="update-bar-text" id="updateBarText"></span>
            <span class="update-bar-close" id="updateBarClose">&times;</span>
        </div>
        <header class="header">
            <div class="titlebar-drag">
                <span class="logo">MultiGit</span>
            </div>
            <div class="titlebar-controls">
                <button class="btn-icon btn-titlebar" id="btnTheme" title="切换主题">&#9788;</button>
                <button class="btn-icon btn-titlebar" id="btnConfig" title="设置">&#9881;</button>
                <button class="btn-icon btn-titlebar" id="btnMinimize" title="最小化">&minus;</button>
                <button class="btn-icon btn-titlebar" id="btnMaximize" title="最大化">&#9633;</button>
                <button class="btn-icon btn-titlebar btn-close" id="btnClose" title="关闭">&times;</button>
            </div>
        </header>
        <main class="main">
            <aside class="panel panel-left">
                <form id="updateForm" class="form">
                    <div class="tab-bar">
                        <button type="button" class="tab tab-active" data-mode="history">历史记录</button>
                        <button type="button" class="tab" data-mode="update">更新依赖</button>
                        <button type="button" class="tab" data-mode="cherrypick">Cherry-Pick</button>
                        <button type="button" class="tab" data-mode="forcecheckout">强制检出</button>
                    </div>
                    <div class="form-group">
                        <label class="form-label">项目根目录</label>
                        <div class="input-row">
                            <input type="text" id="rootPath" class="input" placeholder="选择项目根目录..." readonly />
                            <button type="button" class="btn btn-secondary" id="btnBrowse">浏览</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">选择项目</label>
                        <div id="projectList" class="checkbox-list"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" id="branchLabel" for="branch">目标分支</label>
                        <select id="branch" class="input"></select>
                    </div>
                    <div id="updateSection">
                        <div class="form-group">
                            <label class="form-label">选择更新包</label>
                            <div id="packageList" class="checkbox-list"></div>
                        </div>
                        <div id="packageVersions" class="form-group" style="display:none"></div>
                        <div class="button-row">
                            <button type="submit" class="btn btn-primary" id="btnRun">执行更新</button>
                            <button type="button" class="btn btn-secondary" id="btnReset">重置</button>
                        </div>
                    </div>
                    <div id="cherrypickSection" style="display:none">
                        <div class="form-group">
                            <label class="form-label" for="cpDestBranch">Cherry-Pick 目标分支</label>
                            <input type="text" id="cpDestBranch" class="input" placeholder="输入目标分支名" />
                        </div>
                        <div class="button-row">
                            <button type="button" class="btn btn-secondary" id="btnFetchCommits">获取最近提交</button>
                            <button type="button" class="btn btn-primary" id="btnCherryPick">执行 Cherry-Pick</button>
                        </div>
                        <div id="commitList" class="form-group commit-list"></div>
                    </div>
                    <div id="forcecheckoutSection" style="display:none">
                        <div class="form-group">
                            <label class="form-label" for="fcTargetBranch">强制检出目标分支</label>
                            <input type="text" id="fcTargetBranch" class="input" placeholder="输入目标分支名（将重置为该分支）" />
                        </div>
                        <div class="form-group">
                            <div class="checkbox-list fc-info" style="border-color:var(--warn);padding:10px;background:var(--surface);font-size:12px;color:var(--warn);">
                                ⚠ 目标分支将被强制重置为源分支的最新状态，历史将被覆盖<br>
                                <span style="color:var(--success)">✔ 目标分支存在时将自动备份为 <strong>xxx-backup</strong></span>
                            </div>
                        </div>
                        <div class="button-row">
                            <button type="button" class="btn btn-primary" id="btnForceCheckout" style="background:var(--error);">执行强制检出</button>
                        </div>
                        <div class="button-row" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px;">
                            <button type="button" class="btn btn-secondary" id="btnRestoreBackup" style="color:var(--success);border-color:var(--success);">还原 -backup 备份分支</button>
                            <button type="button" class="btn btn-secondary" id="btnDeleteBackup" style="color:var(--warn);border-color:var(--warn);">清理 -backup 备份分支</button>
                        </div>
                    </div>
                    <div id="historySection" style="display:none">
                        <div class="button-row">
                            <button type="button" class="btn btn-secondary" id="btnFetchHistory">获取提交</button>
                        </div>
                    </div>
                </form>
            </aside>
            <section class="panel panel-right">
                <div class="terminal" id="terminal">
                    <div class="terminal-content" id="terminalContent">
                        <span class="terminal-prompt">$ _</span>
                    </div>
                </div>
                <div id="historyPanel" style="display:none;flex-direction:column;height:100%;padding:12px 16px;overflow:hidden">
                    <div id="historyPanelMsg" style="display:none;padding:8px 12px;border-radius:var(--radius);font-size:12px;margin-bottom:8px"></div>
                    <input type="text" id="historyPanelSearch" placeholder="🔍 搜索提交信息、作者或 commit-id..." style="width:100%;padding:7px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;outline:none;margin-bottom:8px;flex-shrink:0" />
                    <div class="tab-bar" id="historyPanelTabs" style="flex-shrink:0"></div>
                    <div id="historyPanelContent" style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin-top:4px"></div>
                </div>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="confirmModal" style="display:none">
        <div class="modal" id="confirmModalBox">
            <div class="modal-header">
                <h2 id="confirmTitle">确认操作</h2>
            </div>
            <div class="modal-body">
                <p id="confirmMessage" style="font-size:13px;line-height:1.6;color:var(--text)"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="confirmCancel">取消</button>
                <button class="btn" id="confirmOk">确认</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="configModal" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h2>设置</h2>
                <button class="btn-icon" id="btnCloseConfig">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="cfgRegistry">npm 镜像源</label>
                    <input type="text" id="cfgRegistry" class="input" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="cfgPackages">常用包名（逗号分隔，支持 pkg@version）</label>
                    <input type="text" id="cfgPackages" class="input" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="cfgAutoBump">自动升版本的项目（逗号分隔）</label>
                    <input type="text" id="cfgAutoBump" class="input" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="cfgCommitCount">Cherry-Pick 显示提交数</label>
                    <input type="number" id="cfgCommitCount" class="input" min="1" max="100" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="btnSaveConfig">保存</button>
                <button class="btn btn-secondary" id="btnCancelConfig">取消</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="historyModal" style="display:none">
        <div class="modal" id="historyModalBox" style="width:640px;overflow:hidden">
            <div class="modal-header">
                <h2>历史记录</h2>
                <div style="display:flex;gap:4px">
                    <button class="btn-icon" id="btnMaximizeHistory" title="最大化">&#9633;</button>
                    <button class="btn-icon" id="btnCloseHistory">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="historyModalBody" style="min-height:200px;padding-bottom:8px">
                <div class="tab-bar" id="historyModalTabs"></div>
                <div id="historyModalContent" style="margin-top:8px;max-height:300px;overflow-y:auto;overflow-x:hidden"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnCloseHistoryFooter">关闭</button>
            </div>
        </div>
    </div>

</body>
</html>
